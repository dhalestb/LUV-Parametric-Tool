name: Proto-Form presentation
on:
  push:
    branches: ['codex/proto-form-presentation-locked-2026-11-25']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation-format-lock:
    name: Presentation format lock
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the review checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the verified Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install the committed dependency lockfile
        run: npm ci --ignore-scripts
      - name: Verify formatting, preserved assets and editable rule content
        run: |
          node scripts/presentation-format-lock.cjs
          node scripts/presentation-format-tests.cjs
      - name: Verify versioned Lobby packages and saved studies
        run: node scripts/lobby-integration-smoke.cjs
